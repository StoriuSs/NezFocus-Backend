# What runs when (docs/ci.md explains all of it):
#
#   push to main       every check, then the production image: built, started,
#                      scanned, and published as ghcr.io/<owner>/<repo>:<12-character
#                      commit>, the tag deploy.sh pulls with DEPLOY_IMAGE_SOURCE=registry
#   push to a branch   the checks, compared with main: nothing when only
#                      documentation differs; the image too (built, started and
#                      scanned, not published) when the Dockerfile, the
#                      dependencies or the migrations differ
#   pull request       from a fork only (a branch of this repository is tested by its push)
#   Run workflow       (Actions tab) every check and the image, on any branch; the
#                      image is published only from main
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces a run in progress. On main each
# commit is its own group, so none is cancelled or replaced and every one
# gets its image: with one group, GitHub keeps a single waiting run and drops
# the one before it when a third commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# bash with pipefail. GitHub's default for run steps is `bash -e` without it,
# where a failing command before a pipe goes unnoticed.
defaults:
  run:
    shell: bash

jobs:
  # Decides whether the checks and the image run. Everything else waits for
  # its answer.
  changes:
    name: What changed
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      image: ${{ steps.diff.outputs.image }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: What differs from main?
        id: diff
        env:
          # A fork's pull request: its base. A push: empty, main is used.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          # What goes into the image: the Dockerfile, the dependencies or the migrations.
          IMAGE_INPUTS: '^(Dockerfile|\.dockerignore|\.nvmrc|\.npmrc|\.trivyignore|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|prisma/|scripts/smoke-image\.sh)'
        run: |
          # main always runs everything: each of its commits needs an image,
          # since deploy.sh deploys the latest one.
          if [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            code=true image=true
          else
            # Everything the branch changes, compared with main rather than
            # with the previous push: when that push's run was cancelled or
            # failed, a docs-only push after it skipped checks over code that
            # was never tested.
            base=${BASE:-$(git merge-base origin/main "$GITHUB_SHA" 2>/dev/null || true)}
            if [ -z "$base" ]; then
              code=true image=true
            else
              files=$(git diff --name-only "$base" "$GITHUB_SHA")
              code=false image=false
              if grep -qvE '^docs/|\.md$' <<< "$files"; then code=true; fi
              if grep -qE "$IMAGE_INPUTS" <<< "$files"; then image=true; fi
            fi
          fi
          [ "$code" = true ] || echo "::notice title=Checks skipped::This branch differs from main only in documentation (docs/ and .md files)."
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      # The commit the constraint checks (CONSTRAINTS.md) measure this run's
      # change against: a fork's base, else the branch tip before this push,
      # else where the branch left main. Empty when none exists.
      - name: What is the change measured against?
        id: base
        env:
          PR_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=$PR_BASE
          if [ -z "$base" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; fi
          if [ -z "$base" ]; then base=$(git merge-base origin/main "$GITHUB_SHA" 2>/dev/null || true); fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

  checks:
    name: Lint, types, unit and e2e tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-line coverage below diffs against an earlier commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What a fresh clone does first (GETTING_STARTED.md): the Prisma config
      # and the env check read it.
      - run: cp .env.example .env.development
      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test --coverage --collectCoverageFrom='src/**/*.ts' --coverageReporters=lcov --coverageReporters=text-summary
      # Read from the report the run above wrote, not a second run (CONSTRAINTS.md).
      - name: Changed lines in domain/ and application/ are at least 80% covered
        if: needs.changes.outputs.base != ''
        run: node scripts/constraints/coverage-changed.mjs --base "${{ needs.changes.outputs.base }}" --lcov coverage/lcov.info
      - run: pnpm test:e2e
      - name: openapi.json matches the code
        run: pnpm openapi:check
      - name: .env.example matches the configuration schema
        run: pnpm env:check

  integration:
    name: Integration tests and migrations
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env.development
      - run: pnpm prisma:generate
      # Docker Hub now and then doesn't answer a runner in time; pulling first,
      # with retries, keeps that from failing the check (scripts/pull-images.sh).
      - name: Pull the service images
        run: >-
          docker compose --env-file .env.development -f docker-compose.dev.yaml --profile testing
          config --images db redis rustfs mailpit | xargs scripts/pull-images.sh
      - name: Start Postgres, Redis, RustFS and Mailpit
        run: pnpm test:services:up
      - run: pnpm test:integration
      - name: The migrations produce the schema
        run: |
          docker exec postgres-nezfocus-web sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE DATABASE shadow"'
          SHADOW_DATABASE_URL=$(node -e "
            const e = require('dotenv').parse(require('fs').readFileSync('.env.development'))
            const auth = encodeURIComponent(e.DB_USERNAME) + ':' + encodeURIComponent(e.DB_PASSWORD)
            console.log('postgresql://' + auth + '@localhost:' + e.DB_PORT + '/shadow')")
          export SHADOW_DATABASE_URL
          pnpm prisma:check
      - name: Service logs
        if: failure()
        run: docker compose --env-file .env.development -f docker-compose.dev.yaml --profile testing logs --no-color --tail 200 db redis rustfs rustfs-buckets mailpit

  monitoring:
    name: Monitoring configuration
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Docker Hub now and then doesn't answer a runner in time; pulling first,
      # with retries, keeps that from failing the check (scripts/pull-images.sh).
      - name: Pull the monitoring images
        run: grep -oE '(grafana|prom)/[a-z-]+:[A-Za-z0-9._-]+' package.json | sort -u | xargs scripts/pull-images.sh
      # Alloy, Loki, promtool and amtool, each in the image the stack runs.
      - run: pnpm monitoring:check

  # The CONSTRAINTS.md floor and gitleaks, over what this push changes. Runs
  # for documentation-only pushes too: weakening CONSTRAINTS.md is one.
  guard:
    name: Constraints floor and secrets
    needs: changes
    if: needs.changes.outputs.base != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install gitleaks
        run: |
          # GitHub's release downloads answer 5xx now and then: retry, and
          # only unpack a file that arrived whole.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C /usr/local/bin gitleaks
      - name: No suppressions, stubs, skipped or removed tests, weakened constraints
        run: node scripts/constraints/floor-guard.mjs --ci --base "${{ needs.changes.outputs.base }}"
      - name: No secrets
        run: node scripts/constraints/secrets.mjs --base "${{ needs.changes.outputs.base }}"

  # Semgrep over the source files this push changes; quality-gate.mjs fails
  # the step on high or critical findings, or on an incomplete scan.
  semgrep:
    name: Code scan
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.base != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEMGREP_VERSION: 1.181.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: pipx install "semgrep==${SEMGREP_VERSION}"
      - name: No high or critical findings in changed code
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'src/*.ts' | grep -vE '[.-]spec\.ts$' || true)
          if [ ${#files[@]} -eq 0 ]; then echo "No changed source files to scan."; exit 0; fi
          semgrep scan --config p/default --strict --metrics=off --json --output semgrep-results.json "${files[@]}"
          node scripts/constraints/quality-gate.mjs semgrep semgrep-results.json

  audit:
    name: Dependency advisories
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Production dependencies only: they are what the image ships. Not a
      # requirement of the image job, so a newly published advisory doesn't
      # hold up an urgent fix; it fails here until dealt with.
      - run: pnpm audit --prod --audit-level high

  image:
    name: Production image
    needs: [changes, checks, integration, monitoring]
    # main, Run workflow, and a branch that changes what goes into the image
    # (a Dockerfile or dependency update, Renovate's included), so a problem
    # there shows before the merge. Other branch pushes don't spend six
    # minutes on it. Published from main only.
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TRIVY_IMAGE: aquasec/trivy:0.74.0
    steps:
      - uses: actions/checkout@v7
      - name: Name and tag
        id: image
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          pull: true
          load: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The last stage only upgrades Alpine's packages: built afresh every
          # time, or its upgrade would come from the cache and stay as old as
          # the cache (Dockerfile, stage 6). Seconds; the others keep the cache.
          no-cache-filters: prod
      # Docker Hub now and then doesn't answer a runner in time; pulling first,
      # with retries, keeps that from failing the check (scripts/pull-images.sh).
      - name: Pull the images of the smoke test and the scan
        run: |
          { grep -oE '\b(postgres|redis):[0-9][A-Za-z0-9._-]*' scripts/smoke-image.sh; echo "$TRIVY_IMAGE"; } \
            | sort -u | xargs scripts/pull-images.sh
      - name: Starts, migrates, and reaches Postgres and Redis
        run: scripts/smoke-image.sh "${{ steps.image.outputs.ref }}"
      # Trivy's vulnerability database, downloaded at most once a day.
      - name: Date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-
      # A finding accepted on purpose goes in .trivyignore, with the reason
      # (docs/ci.md).
      - name: No fixable high or critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "${{ steps.image.outputs.ref }}" || status=$?
          # Trivy writes as root; the cache step then saves the database as the runner.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/trivy"
          exit "${status:-0}"
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: docker push "${{ steps.image.outputs.ref }}"
