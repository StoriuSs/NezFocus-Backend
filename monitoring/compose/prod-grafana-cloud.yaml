# Grafana Cloud monitoring for docker-compose.prod.yaml: only Alloy runs
# here, and sends logs and metrics to Grafana Cloud. Included by that file when
# MONITORING=grafana-cloud; prod-local.yaml is the default. Alert rules,
# notifications and dashboards live in Grafana Cloud: `pnpm monitoring:cloud-sync`
# puts them there. See docs/monitoring.md, "Grafana Cloud".
#
# Paths are relative to the repository root (the include sets
# project_directory), and `backend` is the network the main file defines.

services:
  # ── Alloy — logs and metrics to Grafana Cloud (monitoring/alloy/grafana-cloud.alloy) ──
  alloy:
    container_name: alloy-hexagonal-auth-prod
    image: grafana/alloy:v1.19.2
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"  # UI, localhost only — SSH tunnel
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data  # read positions
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}  # collect this stack's containers only; the `project` label
      ENVIRONMENT: production                   # the `environment` label
      # Where to send, and as whom (docs/monitoring.md, "Grafana Cloud").
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:?set GRAFANA_CLOUD_PROMETHEUS_URL in .env.production (MONITORING=grafana-cloud)}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:?set GRAFANA_CLOUD_PROMETHEUS_USER in .env.production (MONITORING=grafana-cloud)}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:?set GRAFANA_CLOUD_LOKI_URL in .env.production (MONITORING=grafana-cloud)}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:?set GRAFANA_CLOUD_LOKI_USER in .env.production (MONITORING=grafana-cloud)}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:?set GRAFANA_CLOUD_TOKEN in .env.production (MONITORING=grafana-cloud)}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting  # no anonymous usage statistics to Grafana Labs
      - /etc/alloy/grafana-cloud.alloy
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # ~95M idle, 120M while shipping a burst of 60k lines
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  alloy-data:
