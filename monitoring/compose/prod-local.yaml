# Local monitoring for docker-compose.prod.yaml: Prometheus, Grafana, Loki
# and Alertmanager on this machine. Included by that file when MONITORING is
# local (the default); with MONITORING=grafana-cloud, the prod-grafana-cloud.yaml
# file next to this one is included instead. See docs/monitoring.md.
#
# Paths are relative to the repository root (the include sets
# project_directory), and `backend` is the network the main file defines.

services:
  # ── Prometheus — Metrics Collection ──
  prometheus:
    container_name: prometheus-hexagonal-auth-prod
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"  # Internal port isolation. Hidden from public internet. Services communicate via internal Docker Network.
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}  # the `project` label on alerts
      ENVIRONMENT: production                   # the `environment` label
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=1GB'
      # The address you open Prometheus at (over an SSH tunnel on a server):
      # links in alerts ("Source" in Alertmanager) point here.
      - '--web.external-url=http://localhost:${PROMETHEUS_PORT:-9090}'
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Grafana — Metrics Visualization ──
  grafana:
    container_name: grafana-hexagonal-auth-prod
    # 12.4, the maintained line before 13: Grafana 13.2 grew past 1 GB while
    # showing these dashboards, and was killed at the production limit (256M).
    # 12.4 stays near 150 MB. Check memory before moving to a newer major.
    image: grafana/grafana:12.4.11
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"  # localhost only — Nginx or SSH tunnel
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # No fallback: an unset password must stop the deploy, not become admin.
      # Grafana applies this only when grafana-data is first created. To
      # rotate it later: docker compose -f docker-compose.prod.yaml exec
      # grafana grafana cli admin reset-admin-password '<new password>'
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.production}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false  # no usage statistics to Grafana Labs
      # Grafana logs every query it runs at info: each refresh of a log
      # dashboard added dozens of lines to the very logs it shows. The
      # logger names differ between versions (tsdb.loki in 12, plugin.loki
      # in 13); bleve-backend is the search index, logged on every page.
      - GF_LOG_FILTERS=tsdb.loki:warn plugin.loki:warn plugin.prometheus:warn bleve-backend:warn
      # Grafana is accessed via SSH tunnel (ssh -L 3002:127.0.0.1:3002 ...),
      # not via Nginx at a /grafana subpath. So it serves at root /.
      # If you ever proxy this through Nginx at https://example.com/grafana/,
      # re-add BOTH together — they're a pair:
      #   - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/grafana/
      #   - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Setting only ROOT_URL causes 302s to /grafana/* that Grafana itself
      # can't serve — see docs/LESSONS.md "Accessing Grafana in production".
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Loki — Log Aggregation ──
  loki:
    container_name: loki-hexagonal-auth-prod
    image: grafana/loki:3.7.7
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"  # Localhost only
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      # Log alert rules. "fake" is the tenant Loki uses when auth is off.
      - ./monitoring/loki/rules:/etc/loki/rules/fake:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Alertmanager — delivers alerts to Discord (or another receiver) ──
  alertmanager:
    container_name: alertmanager-hexagonal-auth-prod
    image: prom/alertmanager:v0.34.1
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"  # localhost only — SSH tunnel
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager   # silences, and which alerts were already sent
    environment:
      # Required: a production stack that can't alert anyone must not start.
      # An environment value, not a compose secret: compose recreates the
      # container when it changes, and left a changed secret unapplied.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?set ALERT_WEBHOOK_URL in .env.production, see docs/alerts.md}
      # Optional dead man's switch; also needs its receiver enabled in alertmanager.yml.
      ALERT_HEARTBEAT_URL: ${ALERT_HEARTBEAT_URL:-}
    # Alertmanager reads URLs from files (alertmanager.yml), not from the
    # environment: write them to files only this container's user can read,
    # then start. --cluster.listen-address= : a single Alertmanager, no cluster.
    # --web.external-url: the address you open it at, for its links.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 && printf '%s' "$$ALERT_WEBHOOK_URL" > /tmp/alert_webhook_url &&
        printf '%s' "$$ALERT_HEARTBEAT_URL" > /tmp/alert_heartbeat_url &&
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
        --storage.path=/alertmanager --cluster.listen-address=
        --web.external-url=http://localhost:${ALERTMANAGER_PORT:-9093}
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Alloy — Log Shipping to Loki (monitoring/alloy/local.alloy) ──
  alloy:
    container_name: alloy-hexagonal-auth-prod
    image: grafana/alloy:v1.19.2
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"  # UI, localhost only — SSH tunnel
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      - alloy-data:/var/lib/alloy/data  # read positions
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}  # collect this stack's containers only; the `project` label
      ENVIRONMENT: production                   # the `environment` label
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting  # no anonymous usage statistics to Grafana Labs
      - /etc/alloy/local.alloy
    depends_on:
      - loki
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # ~95M idle, 120M while shipping a burst of 60k lines
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  alloy-data:
  alertmanager-data:
  prometheus-data:
  grafana-data:
  loki-data:
